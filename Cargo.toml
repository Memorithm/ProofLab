[workspace]
members = [
    "crates/prooflab-core",
    "crates/prooflab-lean",
    "crates/prooflab-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Memorithm/ProofLab"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
